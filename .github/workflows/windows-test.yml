name: DeepCurrent Windows Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt

      - name: Build DeepCurrent
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name DeepCurrent --collect-all PyQt5.QtWebEngineWidgets --collect-all PyQt5.QtMultimedia --collect-submodules PyQt5.QtWebChannel deepcurrent_windows.py

      - name: Prepare package
        shell: pwsh
        run: |
          Copy-Item README-Windows.txt dist/DeepCurrent/README-Windows.txt
          Compress-Archive -Path dist/DeepCurrent -DestinationPath DeepCurrent-Windows-Test-v0.1.zip

      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: DeepCurrent-Windows-Test-v0.1
          path: DeepCurrent-Windows-Test-v0.1.zip
          if-no-files-found: error
